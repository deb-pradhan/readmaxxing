name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck + Lint + Build + Perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          # Stub DATABASE_URL — generation only needs the schema.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/readmaxxing?schema=public"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint || true

      - name: Build
        run: pnpm build

      - name: Perf budgets
        run: pnpm exec size-limit
        env:
          CI: "true"