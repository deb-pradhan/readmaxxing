# =============================================================================
# ReadMaxxing — Railway multi-service plan.
#
# This file is the entry-point Railway reads when you run `railway up` from
# the repo root. It describes the two application services (web + worker).
# The database (Postgres), cache (Redis), and persistent volume (podcast audio)
# are provisioned as separate Railway services via the dashboard / CLI and
# referenced by name as environment variables.
#
# Reference: https://docs.railway.app/reference/config-as-code
# =============================================================================

[build]
builder = "NIXPACKS"

# --- Web service -------------------------------------------------------------
# Next.js 15 App Router. Runs `pnpm build` then `pnpm start` via Nixpacks'
# automatic detection of the workspace's root `package.json` scripts.
[[deploy]]
name            = "web"
source          = { repo = "." }
buildCommand    = "pnpm install --frozen-lockfile && pnpm db:generate && pnpm build"
startCommand    = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.variables]
# Public app URL — used by the worker and by the OpenRouter HTTP-Referer header.
NEXT_PUBLIC_APP_URL = { generator = "static", value = "${{RAILWAY_PUBLIC_DOMAIN}}" }
NODE_ENV = { generator = "static", value = "production" }

# Worker handshake — these come from the `worker-python` service's
# private network reference plus the shared secret you set in the dashboard.
WORKER_API_URL = { generator = "static", value = "http://worker-python.railway.internal:8000" }
WORKER_API_TOKEN = { generator = "env", value = "WORKER_API_TOKEN" }