[project]
name = "readmaxxing-worker"
version = "0.1.0"
description = "ReadMaxxing Python worker: document parsing, OCR, LLM orchestration (via OpenRouter), local TTS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "ReadMaxxing" }]

# Runtime dependencies — grouped by purpose.
#
# LLM STRATEGY: we use OpenRouter (https://openrouter.ai/) as the single LLM
# gateway via the `httpx` library. One API key in OPENROUTER_API_KEY gives us
# access to any model — OpenAI, Anthropic, Google, Meta, Mistral, etc. — with
# automatic fallback. The OpenAI / Anthropic SDKs are intentionally not
# installed; we only have direct access to providers that don't go through
# OpenRouter. The corresponding SDKs are listed below for reference but
# commented out:
#
#   "openai==1.55.0",          # direct OpenAI access (bypass OpenRouter)
#   "anthropic==0.39.0",       # direct Anthropic access (bypass OpenRouter)
#   "langchain==0.3.13",       # orchestration library (not used; we hit OpenRouter directly)
#   "langchain-openai==0.2.12",
#   "langchain-anthropic==0.3.1",
dependencies = [
  # --- HTTP API ---
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.2",
  "pydantic-settings==2.6.1",
  "python-multipart==0.0.18",
  # httpx is also our OpenRouter HTTP client (the only LLM path).
  "httpx==0.27.2",

  # --- Task queue ---
  "celery[redis]==5.4.0",
  "redis==5.2.0",

  # --- Document parsing ---
  "pypdf==5.1.0",
  "pdfplumber==0.11.4",
  "python-docx==1.1.2",
  "mammoth==1.8.0",
  "markdownify==0.14.1",
  "beautifulsoup4==4.12.3",
  "lxml==5.3.0",
  "ebooklib==0.18",
  "readability-lxml==0.8.1",
  # Sentence tokenization — used as a fallback / for non-English docs.
  "nltk==3.9.1",

  # --- OCR ---
  "pytesseract==0.3.13",
  "Pillow==11.0.0",
  "paddleocr==2.9.1",
  "paddlepaddle==2.6.2",

  # --- Audio I/O (Phase 4 podcast mastering + Phase 5 local TTS) ---
  "pydub==0.25.1",
  "TTS==0.22.0",                  # Coqui XTTS for cloning
  "sherpa-onnx==1.10.39",         # sherpa-onnx for Piper / Kokoro
  "soundfile==0.12.1",
  "numpy==2.1.3",

  # --- Web fetching (URL import) ---
  "playwright==1.49.0",
  "trafilatura==1.12.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "ruff==0.8.1",
  "mypy==1.13.0",
  "ipython==8.29.0",
]

[project.scripts]
readmaxxing-worker = "app.main:run"

# --- Build system -----------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Tooling ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]