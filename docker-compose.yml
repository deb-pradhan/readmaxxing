# =============================================================================
# Local development infrastructure.
# Spin up Postgres + Redis with:
#   docker compose up -d
# Then copy `.env.example` → `.env` and fill in real values.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: readmaxxing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: readmaxxing
    ports:
      - "5432:5432"
    volumes:
      - readmaxxing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: readmaxxing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - readmaxxing-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  readmaxxing-postgres-data:
  readmaxxing-redis-data: